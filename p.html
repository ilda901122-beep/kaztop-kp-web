<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#053b46">
<title>Kaztop · коммерческое предложение</title>
<style>
  html { background: #eef4f5; }
  body { margin: 0; font-family: "Segoe UI", system-ui, -apple-system, sans-serif; color: #0e1c21; }
  .top { background: #053b46; color: #eef6f8; padding: 14px 16px; font-weight: 800; letter-spacing: 0.12em; }
  main { max-width: 760px; margin: 0 auto; padding: 16px 12px 40px; }
  .panel { background: #fff; border-radius: 16px; padding: 18px 16px; box-shadow: 0 2px 10px rgba(14,28,33,0.06); }
  h1 { font-size: 20px; margin: 0 0 6px; word-break: break-word; }
  .status { color: #55656b; font-size: 15px; margin: 0 0 14px; }
  .status.err { color: #c1121f; }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .actions a, .actions button { display: flex; align-items: center; justify-content: center; border-radius: 11px; padding: 13px 10px; font: inherit;
    font-size: 16px; font-weight: 700; border: 1px solid rgba(14,28,33,0.18); background: #fff; color: #0e1c21; text-decoration: none; cursor: pointer; }
  .actions .primary { grid-column: 1 / -1; background: #00afca; color: #fff; border: 0; }
  .actions a:focus-visible, .actions button:focus-visible { outline: 2px solid #00afca; outline-offset: 2px; }
  .preview { margin-top: 14px; width: 100%; height: 80vh; border: 1px solid rgba(14,28,33,0.12); border-radius: 12px; background: #fff; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="top">KAZTOP</div>
<main>
  <div class="panel">
    <h1 id="name">Коммерческое предложение</h1>
    <p id="status" class="status" role="status">Загружаю PDF…</p>
    <div id="actions" class="actions" hidden>
      <a id="open" class="primary" href="#" target="_blank" rel="noopener">Открыть PDF</a>
      <button type="button" id="share" hidden>Поделиться</button>
      <a id="download" href="#" download>Скачать</a>
    </div>
  </div>
  <iframe id="preview" class="preview" title="PDF" hidden></iframe>
</main>
<script>
/* Просмотр PDF из общей истории: файл берётся из архива (ветка history) или из релея (первые 3 ч),
   расшифровывается ключом из части ссылки после #, которая на сервер не уходит. */
(function () {
  'use strict';
  var ARCHIVE = 'https://raw.githubusercontent.com/ilda901122-beep/kaztop-kp-web/history', RELAY = 'https://ntfy.sh';
  var $ = function (s) { return document.getElementById(s); };
  function fail(msg) { $('status').textContent = msg; $('status').className = 'status err'; }
  function unb64u(str) { var s = String(str).replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); }
  async function get(url) {
    try { var r = await fetch(url, { cache: 'no-store' }); return r.ok ? new Uint8Array(await r.arrayBuffer()) : null; }
    catch (e) { return null; }
  }
  async function run() {
    var parts = location.hash.slice(1).split('.');
    if (parts.length < 3 || !/^[A-Za-z0-9]{6,32}$/.test(parts[0])) { fail('Ссылка неполная: скопируйте её целиком, вместе с частью после знака #.'); return; }
    if (!window.crypto || !crypto.subtle) { fail('Браузер не поддерживает расшифровку. Откройте ссылку в Safari или Chrome.'); return; }
    var name = 'KP.pdf';
    try { if (parts[3]) name = new TextDecoder().decode(unb64u(parts[3])) || name; } catch (e) { /* имя по умолчанию */ }
    if (!/\.pdf$/i.test(name)) name += '.pdf';
    $('name').textContent = name.replace(/\.pdf$/i, '');
    document.title = name + ' · Kaztop';
    var qs = new URLSearchParams(location.search);
    var archive = qs.get('a') || ARCHIVE, relay = qs.get('r') || RELAY;
    var source = 'archive';
    var ct = await get(archive + '/f/' + parts[0] + '.bin');
    if (!ct) { source = 'relay'; ct = await get(relay + '/file/' + parts[0] + '.bin'); }
    if (!ct) { fail('Файл не найден: ссылка устарела или архив ещё обновляется (до 15 минут). Попробуйте позже или попросите менеджера прислать файл.'); return; }
    var pt;
    try {
      var key = await crypto.subtle.importKey('raw', unb64u(parts[1]), { name: 'AES-GCM' }, false, ['decrypt']);
      pt = new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64u(parts[2]) }, key, ct));
    } catch (e) { fail('Не удалось открыть файл: ссылка повреждена. Скопируйте её целиком.'); return; }
    var file = new File([pt], name, { type: 'application/pdf' });
    var url = URL.createObjectURL(file);
    $('open').href = url;
    $('download').href = url; $('download').setAttribute('download', name);
    try { $('share').hidden = !(navigator.canShare && navigator.canShare({ files: [file] })); } catch (e) { $('share').hidden = true; }
    $('share').addEventListener('click', function () { navigator.share({ files: [file], title: name }).catch(function () { /* отмена */ }); });
    $('status').textContent = 'PDF готов: ' + Math.round(file.size / 1024) + ' КБ.';
    $('actions').hidden = false;
    if (window.matchMedia('(min-width: 700px)').matches) { $('preview').src = url; $('preview').hidden = false; }
    window.__viewerReady = { size: file.size, name: name, source: source };
  }
  run();
})();
</script>
</body>
</html>
